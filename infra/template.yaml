AWSTemplateFormatVersion: "2010-09-09"
Description: AutoSchedule - start/stop tagged EC2, RDS and SageMaker notebook instances.

Parameters:
  LabRoleArn:
    Type: String
    Description: Existing Learner Lab LabRole ARN. No IAM role is created by this template.
  CodeBucket:
    Type: String
  CodeKey:
    Type: String
    Default: scheduler.zip
  AlertEmail:
    Type: String
  ProjectTag:
    Type: String
    Default: AutoSchedule
  OwnerTag:
    Type: String
  EnforceSchedule:
    Type: String
    Default: "rate(15 minutes)"
  ReportSchedule:
    Type: String
    Default: "cron(0 1 * * ? *)"

Resources:
  ReportTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: autoschedule-report
      Tags:
        - Key: Project
          Value: !Ref ProjectTag
        - Key: Owner
          Value: !Ref OwnerTag

  ReportSubscription:
    Type: AWS::SNS::Subscription
    Properties:
      TopicArn: !Ref ReportTopic
      Protocol: email
      Endpoint: !Ref AlertEmail

  LogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/lambda/autoschedule
      RetentionInDays: 7
      Tags:
        - Key: Project
          Value: !Ref ProjectTag
        - Key: Owner
          Value: !Ref OwnerTag

  SchedulerFn:
    Type: AWS::Lambda::Function
    DependsOn: LogGroup
    Properties:
      FunctionName: autoschedule
      Runtime: python3.12
      Handler: scheduler.lambda_handler
      Role: !Ref LabRoleArn
      Timeout: 120
      MemorySize: 128
      Code:
        S3Bucket: !Ref CodeBucket
        S3Key: !Ref CodeKey
      Environment:
        Variables:
          TOPIC_ARN: !Ref ReportTopic
          TZ_NAME: Asia/Ho_Chi_Minh
          PROJECT_TAG: !Ref ProjectTag
      Tags:
        - Key: Project
          Value: !Ref ProjectTag
        - Key: Owner
          Value: !Ref OwnerTag

  EnforceRule:
    Type: AWS::Events::Rule
    Properties:
      Description: Evaluate resource schedules every 15 minutes.
      ScheduleExpression: !Ref EnforceSchedule
      State: ENABLED
      Targets:
        - Id: enforce
          Arn: !GetAtt SchedulerFn.Arn
      Tags:
        - Key: Project
          Value: !Ref ProjectTag
        - Key: Owner
          Value: !Ref OwnerTag

  ReportRule:
    Type: AWS::Events::Rule
    Properties:
      Description: Daily managed-resource report at 08:00 Vietnam time.
      ScheduleExpression: !Ref ReportSchedule
      State: ENABLED
      Targets:
        - Id: report
          Arn: !GetAtt SchedulerFn.Arn
          Input: '{"action":"report"}'
      Tags:
        - Key: Project
          Value: !Ref ProjectTag
        - Key: Owner
          Value: !Ref OwnerTag

  PermEnforce:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref SchedulerFn
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt EnforceRule.Arn

  PermReport:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref SchedulerFn
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt ReportRule.Arn

  ErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: autoschedule-errors
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref SchedulerFn
      Statistic: Sum
      Period: 900
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref ReportTopic
      Tags:
        - Key: Project
          Value: !Ref ProjectTag
        - Key: Owner
          Value: !Ref OwnerTag

Outputs:
  FunctionName:
    Value: !Ref SchedulerFn
  TopicArn:
    Value: !Ref ReportTopic
